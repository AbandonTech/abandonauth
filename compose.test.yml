# Started by ./scripts/check.sh --integration and by ./scripts/db.sh.

services:

  database:
    # Matches the deployed major version.
    image: "postgres:15"
    environment:
      POSTGRES_DB: abandonauth_template
      POSTGRES_USER: abandonauth
      POSTGRES_PASSWORD: placeholder
    # Each test holds its own database on this server, so the default 100 is not enough.
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      # Never the template: a session connected to it stops it being cloned.
      test: ["CMD-SHELL", "pg_isready -U abandonauth -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrations:
    build: &api-build
      context: src/api
      dockerfile: Dockerfile
      target: deployment
    entrypoint: ["/usr/local/bin/goose", "-env=none", "-no-color"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: /migrations
      GOOSE_DBSTRING: "host=database port=5432 user=abandonauth dbname=abandonauth_template sslmode=disable connect_timeout=5"
      # scripts/migrationcheck.sh substitutes a wrong sentinel to force a failure.
      PGPASSWORD: ${MIGRATION_CHECK_PASSWORD:-placeholder}
    depends_on:
      database:
        condition: service_healthy

  migration-gate-api:
    profiles: ["migration-gate"]
    build: *api-build
    command: ["maintenance"]
    depends_on:
      migrations:
        condition: service_completed_successfully

  check:
    build:
      context: .
      dockerfile: Dockerfile.test
      additional_contexts:
        api: service:migrations
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      TEST_DATABASE_URL: "postgres://abandonauth:placeholder@database:5432/postgres?sslmode=disable"
      TEST_TEMPLATE_DATABASE: abandonauth_template
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: /migrations
      GOOSE_DBSTRING: "host=database port=5432 user=abandonauth dbname=abandonauth_template sslmode=disable connect_timeout=5"
      PGPASSWORD: placeholder
