# Started by ./scripts/check.sh --integration and by ./scripts/db.sh.

services:

  database:
    # Matches the deployed major version.
    image: "postgres:15"
    environment:
      POSTGRES_DB: abandonauth_test
      POSTGRES_USER: abandonauth
      POSTGRES_PASSWORD: placeholder
    # Each test holds its own database on this server, so the default 100 is not enough.
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abandonauth -d abandonauth_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  check:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      database:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: "postgres://abandonauth:placeholder@database:5432/abandonauth_test?sslmode=disable"
