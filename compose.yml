services:

  abandonauth:
    network_mode: "host"
    build:
      context: src/api
      dockerfile: Dockerfile
      target: development
    env_file:
      # Absent on a checkout that has not been configured yet, which keeps
      # `docker compose config` usable as a validation step.
      - path: ".env"
        required: false
    depends_on:
      database:
        condition: service_healthy

  website:
    network_mode: "host"
    build:
      context: ./src/website
      dockerfile: Dockerfile
      args:
        ABANDON_AUTH_URL: ${ABANDON_AUTH_URL}
        ABANDON_AUTH_DEVELOPER_APP_ID: ${ABANDON_AUTH_DEVELOPER_APP_ID}

  database:
    image: "postgres:${POSTGRES_VERSION:-15-alpine}"
    network_mode: "host"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 1s
      retries: 5
    environment:
      - "POSTGRES_HOST=${POSTGRES_HOST}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_USER=${POSTGRES_USER}"

volumes:
  postgres_data:
