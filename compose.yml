services:

  abandonauth:
    build:
      context: src/api
      dockerfile: Dockerfile
      target: ${API_BUILD_TARGET:-deployment}
    env_file:
      - ".env"
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - default
      - db_access
    depends_on:
      database:
        condition: service_healthy

  website:
    build:
      context: ./src/website
      dockerfile: Dockerfile
      args:
        ABANDON_AUTH_URL: ${ABANDON_AUTH_URL}
        ABANDON_AUTH_SITE_URL: ${ABANDON_AUTH_SITE_URL}
        ABANDON_AUTH_DEVELOPER_APP_ID: ${ABANDON_AUTH_DEVELOPER_APP_ID}
    environment:
      NUXT_API_ADDRESS: ${ABANDON_AUTH_API_ADDRESS}
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
    depends_on:
      - abandonauth

  database:
    image: "postgres:${POSTGRES_VERSION:-15-alpine}"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 2s
      timeout: 1s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - db_access

networks:
  db_access:
    internal: true

volumes:
  postgres_data:
