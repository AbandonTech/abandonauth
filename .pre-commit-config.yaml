repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: Global | Check Yaml
      - id: check-toml
        name: Global | Check Toml
      - id: end-of-file-fixer
        name: Global | End of File Fixer
      - id: trailing-whitespace
        name: Global | Trailing Whitespace
      - id: check-added-large-files
        name: Global | Check Added Large Files

  - repo: local
    hooks:
      # Reports formatting rather than applying it. Run
      # `./scripts/check.sh --fix-fmt` to have it corrected.
      - id: check
        name: Api    | Codegen, Formatting, Lint and Unit Tests
        entry: sh scripts/check.sh
        language: system
        require_serial: true
        pass_filenames: false
        files: '^(src/api/|scripts/)'
