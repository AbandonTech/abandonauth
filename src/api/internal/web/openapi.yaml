          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlFiveMinutes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONWebKeySet"
        "500":
          $ref: "#/components/responses/Unavailable"

