        "500":
          $ref: "#/components/responses/Unavailable"

  /api/oauth/authorize:
    get:
      tags: [OpenID Connect]
      summary: Begin a public client's authorization
      description: >-
        Begin an installed public client's OpenID Connect authorization. The
        client opens the system browser here; the answer is always a 303
        redirect or a direct refusal, never a page.


        Each parameter must appear exactly once: `response_type` `code`,
        `client_id`, `redirect_uri`, `scope`, `state`, `nonce`,
        `code_challenge` and `code_challenge_method` `S256`. `response_mode`
        is optional and must be `query` when present. Unknown parameters are
        ignored. The raw query is at most 8,192 bytes and 32 fields, unknown
        fields included, and every parameter name at most 64 bytes. A query
        with a malformed percent escape, invalid UTF-8, a control character,
        an encoded or differently cased parameter name, a `;` separator, or a
        parameter repeated before or after decoding is refused whole, and no
        part of it is used. A request body is never read.


        The client and the redirect are validated before the redirect is used
        for anything. The client must be a registered public client. The
        redirect must equal one of its registered loopback templates in
        scheme, loopback address, path and query spelling, with exactly one
        numeric port from 1 through 65535 added; the port is the only
        difference accepted. A missing, malformed, repeated, unknown, deleted
        or confidential client, or a missing, malformed, repeated or
        unmatched redirect, is refused with a direct 400 `invalid_request` and
        no `Location`. A query that cannot be read at all is refused the same
        way.


        Once the client and the redirect are proven, every refusal is a 303 to
        that exact redirect: a malformed or repeated remaining parameter with
        `error` `invalid_request`; a response type other than `code` with
        `unsupported_response_type`; a scope outside `openid`, `profile` and
        `offline_access`, a repeated scope or one without `openid` with
        `invalid_scope`; ten thousand authorizations already in progress
        across the whole service with `temporarily_unavailable`; and an
        internal failure with `server_error`. An error redirect carries only
        `error`, `state` when exactly one syntactically valid state was
        supplied, and `iss`. No refusal carries `error_description`.


        On success an authorization is created and bound to the client, the
        exact redirect including its port, the canonical granted scopes, the
        client's `state`, `nonce` and PKCE challenge, this browser and the
        current auth epoch. It expires five minutes after creation and nothing
        that happens to it later extends it. The browser is bound by the
        `NativeAuthorizationBinding` cookie: a syntactically valid one it
        already holds is reused and only its five-minute expiry renewed;
        otherwise a new one is issued. The answer is an empty 303 to the
        AbandonAuth site's origin followed by `/authorize#request=` and an
        opaque 43-character page handle. The handle travels only in the
        fragment, and no client value appears anywhere in that address.


        Nothing is approved silently. The page always names the registered
        application, describes `profile` and the offline session when they are
        requested, and requires the person to choose Discord, GitHub, Google
        or Steam; the client cannot choose a provider for them.


        Every worker serves at most 64 public-protocol requests at once. A
        request arriving when they are all in use is refused with a direct 503
        `temporarily_unavailable` before anything is read. An internal failure
        before the redirect is proven is a direct 500 `server_error`.


        Every answer carries `Cache-Control: no-store`, `Referrer-Policy:
        no-referrer`, `X-Frame-Options: DENY` and `Content-Security-Policy:
        frame-ancestors 'none'`. No cross-origin request is permitted.
      x-abandonauth-served: false
      security: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationResponseType"
        - $ref: "#/components/parameters/AuthorizationClientID"
        - $ref: "#/components/parameters/AuthorizationRedirectURI"
        - $ref: "#/components/parameters/AuthorizationScope"
        - $ref: "#/components/parameters/AuthorizationState"
        - $ref: "#/components/parameters/AuthorizationNonce"
        - $ref: "#/components/parameters/AuthorizationCodeChallenge"
        - $ref: "#/components/parameters/AuthorizationCodeChallengeMethod"
        - $ref: "#/components/parameters/AuthorizationResponseMode"
        - $ref: "#/components/parameters/NativeAuthorizationBindingOptional"
      responses:
        "303":
          $ref: "#/components/responses/AuthorizationStarted"
        "400":
          $ref: "#/components/responses/OAuthInvalidRequest"
        "500":
          $ref: "#/components/responses/OAuthServerError"
        "503":
          $ref: "#/components/responses/OAuthTemporarilyUnavailable"

  /api/oauth/authorization/{request}:
    get:
      tags: [Authorization Page]
      summary: Read a pending authorization request
      description: >-
        Read what the authorization page displays for a public client's
        pending request. The handle is the one the site read from its address
        fragment, and it must be presented by the browser holding the
        `NativeAuthorizationBinding` cookie the request was bound to.


        The answer holds exactly `application_name`, the canonical requested
        `scopes`, `expires_at` and the `providers` to choose from. It never
        carries the redirect URI, the client's state, nonce or challenge, a
        user identifier or anything a provider returned. Reading consumes
        nothing and extends nothing.


