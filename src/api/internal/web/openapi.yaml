        or one presented without the binding cookie it was bound to, is
        answered with the same 404 `Authorization request unavailable`. The
        handle is consumed atomically, so of concurrent choices and
        cancellations for one request exactly one succeeds. The form body
        carries nothing and is never read, so the browser's empty form
        submission is accepted.


        The browser is sent with 303 to the provider exactly as a confidential
        sign-in is, with every provider control unchanged: browser-bound,
        single-use provider state; PKCE with the `S256` challenge method for
        Discord, GitHub and Google; a nonce for Google; and Steam's signed
        return address. The provider state expires at the earlier of five
        minutes and the authorization's own deadline.


        Every worker serves at most 64 public-protocol requests at once. A
        request arriving when they are all in use is answered 503 `Service
        temporarily unavailable` and consumes nothing.


        Every answer carries `Cache-Control: no-store`, `Referrer-Policy:
        no-referrer`, `X-Frame-Options: DENY` and `Content-Security-Policy:
        frame-ancestors 'none'`.
      x-abandonauth-served: false
      security: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationRequestHandle"
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/NativeAuthorizationBinding"
        - $ref: "#/components/parameters/RequiredOrigin"
      requestBody:
        required: false
        description: The browser's empty form submission. Nothing in it is read.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        "303":
          $ref: "#/components/responses/RedirectFromPageToProvider"
        "403":
          $ref: "#/components/responses/AuthorizationRequestForbidden"
        "404":
          $ref: "#/components/responses/AuthorizationRequestUnavailable"
        "500":
          $ref: "#/components/responses/Unavailable"
        "503":
          $ref: "#/components/responses/ServiceTemporarilyUnavailable"

  /api/oauth/authorization/{request}/cancel:
