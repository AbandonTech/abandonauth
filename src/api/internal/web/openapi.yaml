          description: The provider metadata, cacheable for five minutes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlFiveMinutes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIDProviderMetadata"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/oidc/jwks:
    get:
      tags: [OpenID Connect]
      summary: Publish the ID token verification keys
      description: >-
        The public RSA keys that verify ID tokens, and only those; this is the
        discovery document's `jwks_uri`. An access token is never verified
        with a key from this set.


        Each key carries exactly `kid`, `kty` `RSA`, `use` `sig`, `alg`
        `RS256`, `n` and `e`, and no private member. Every `kid` is the
        43-character RFC 7638 thumbprint of its key's public members, and no
        `kid` appears in both key sets. The set holds one to eight keys.


        The answer is cacheable for five minutes. A key is advertised here for
        at least five minutes before it signs, and stays for at least twenty
        minutes after its last possible signature before it is removed. A key
        whose private part is suspected compromised may be removed at once; a
        validator holding a cached copy can keep trusting it for at most that
        five-minute cache lifetime.
      x-abandonauth-served: false
      security: []
      responses:
        "200":
