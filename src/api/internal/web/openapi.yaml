            schema:
              type: object
      responses:
        "303":
          $ref: "#/components/responses/RedirectToPublicClient"
        "403":
          $ref: "#/components/responses/AuthorizationRequestForbidden"
        "404":
          $ref: "#/components/responses/AuthorizationRequestUnavailable"
        "500":
          $ref: "#/components/responses/Unavailable"
        "503":
          $ref: "#/components/responses/ServiceTemporarilyUnavailable"

  /api/oauth/token:
    post:
      tags: [OpenID Connect]
      summary: Exchange an authorization code or a refresh token
      description: >-
        The token endpoint for public clients. Client authentication is
        `none`: an `Authorization` header, a `client_secret` member or any
        other attempt to authenticate the client is refused with 400
        `invalid_request`.


        The body must be `application/x-www-form-urlencoded` with no other
        media type or parameter, at most 16,384 bytes and 16 fields, unknown
        fields included, with every field name at most 64 bytes. Unknown
        fields are ignored; every recognized field appears at most once. A
        body with a malformed percent escape, invalid UTF-8, a control
        character, an encoded or differently cased field name, a `;`
        separator, or a field repeated before or after decoding is refused
        whole. Parameters in the query are never read.


        An authorization code grant carries `grant_type`
        `authorization_code`, `client_id`, `code`, `redirect_uri` and
        `code_verifier`. The code is redeemed by one atomic delete only when it
        was issued to this client for this exact redirect, port included, is
        unexpired, belongs to the current auth epoch, and the unpadded
        base64url SHA-256 of the verifier equals the challenge. Every miss is
        the same 400 `invalid_grant`, and a wrong verifier, client or redirect
        does not consume the code. Of concurrent redemptions of one code
        exactly one succeeds.


        A refresh grant carries `grant_type` `refresh_token`, `client_id`,
        `refresh_token` and optionally `scope`. Refresh tokens rotate: each use
        consumes the presented token and returns its replacement. A consumed
        token presented again revokes its whole family and is refused
        `invalid_grant`, so a client must serialize refreshes and store the
        replacement before discarding the token it presented. A refresh never
        adds scope. Omitted, the grant is kept; supplied, it must be a subset
        that still contains `openid`, and the access token, ID token and
        replacement refresh token are narrowed together. Narrowing away
        `offline_access` ends the family without a replacement. A refresh
        token expires 30 days after it is issued or when its family reaches
        90 days after the code was redeemed, whichever is first. A family holds at most 10,000 tokens; a
        refresh beyond that revokes the family and is refused `invalid_grant`.
        One person holds at most ten active families per application, and
        another offline grant revokes the least recently created one.


        A refresh, like UserInfo, stops working at once when the family is
        revoked, the application or user is deleted, or authority is rotated.
        An access token already issued is not recalled: a resource server
        validating it locally accepts it until it expires fifteen minutes
        after issue.


        A successful answer carries `access_token`, `token_type` `Bearer`,
        `expires_in` 900, `id_token` and the canonical granted `scope`, and,
        exactly when `offline_access` is granted, `refresh_token` and
        `refresh_token_expires_in`. Every answer, success or refusal, carries
        `Cache-Control: no-store` and `Pragma: no-cache`.


        Refusals are 400 `invalid_request` for a missing, malformed, repeated
        or oversized field, a wrong content type, an `Authorization` header or
        a `client_secret`; 400 `unsupported_grant_type` for any other grant;
        400 `invalid_client`, without `WWW-Authenticate`, for a well-formed
        client identifier that is unknown, deleted or not a public client; 400
        `invalid_grant` for a code or refresh token that is unknown, expired,
        replayed, revoked or bound to anything else; 400 `invalid_scope` for a
        narrowing that is not a subset containing `openid`; 503
        `temporarily_unavailable` when the worker already has 64
        public-protocol requests in progress; and 500 `server_error` for an
        internal failure.
      x-abandonauth-served: false
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              anyOf:
                - $ref: "#/components/schemas/AuthorizationCodeGrant"
                - $ref: "#/components/schemas/RefreshTokenGrant"
      responses:
        "200":
          description: The issued tokens.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSet"
        "400":
          $ref: "#/components/responses/OAuthTokenRefused"
        "500":
          $ref: "#/components/responses/OAuthServerError"
        "503":
          $ref: "#/components/responses/OAuthTemporarilyUnavailable"

  /api/oauth/userinfo:
    get:
      tags: [OpenID Connect]
      summary: Describe the person an OIDC access token was issued for
      description: >-
        Return `sub`, the pairwise subject for the token's client, and
        `preferred_username` only when `profile` was granted. No other claim
        is ever returned. A username can be the same at every application, so
        it can be correlated across them; the pairwise subject cannot.


        Only an `OIDCAccessToken` is accepted. Its signature is checked against
        the access token key set, and its issuer, audience, `typ` `at+jwt`,
        exact fifteen-minute validity, the `openid` scope, auth epoch,
        revocation, its public client, its user and the pairwise subject
        mapping are all checked before anything is returned. An ID token, a
        `UserAccessToken` and a `DeveloperApplicationAccessToken` are refused.
        AbandonAuth refuses a token at once after it is revoked, its family or
        application or user is deleted, or authority is rotated.


        A missing, malformed, expired, revoked, wrong-class, wrong-client or
        otherwise invalid token is answered 401 `invalid_token` with the fixed
        challenge `WWW-Authenticate: Bearer error="invalid_token"`; a token
        without the `openid` scope is answered 403 `insufficient_scope` with
        its own fixed challenge. Neither challenge quotes the token or a
        claim. When the worker already has 64 public-protocol requests in
        progress the answer is 503 `temporarily_unavailable`, and an internal
        failure is 500 `server_error`.
      x-abandonauth-served: false
      security:
        - OIDCAccessToken: []
      responses:
        "200":
          description: The claims the token's grant releases.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/OAuthInvalidToken"
        "403":
          $ref: "#/components/responses/OAuthInsufficientScope"
        "500":
          $ref: "#/components/responses/OAuthServerError"
        "503":
          $ref: "#/components/responses/OAuthTemporarilyUnavailable"

  /api/oauth/revoke:
    post:
      tags: [OpenID Connect]
      summary: Revoke a refresh token or an OIDC access token
      description: >-
        Revoke a token a public client holds. Client authentication is
        `none`. The body carries `client_id`, `token` and any number of
        `token_type_hint` fields, under the same form rules as
        `POST /api/oauth/token`: `application/x-www-form-urlencoded`, at most
        16,384 bytes and 16 fields, names of at most 64 bytes, unknown fields
        ignored, recognized fields at most once, a malformed body refused
        whole, and the query never read.


        `token_type_hint` is accepted and completely ignored: omitted, empty,
        repeated, unknown, encoded or differently cased hints all behave
        exactly as no hint, though they count toward the size and field
        limits. Both supported token classes are always checked.


        A refresh token revokes its whole family at once. An OIDC access
        token's identifier is recorded so that UserInfo refuses it at once; a
        resource server validating it locally still accepts it until it
        expires fifteen minutes after issue.


        A well-formed request is answered with the same empty 200 when the
        token was revoked, was already revoked, was never issued, belongs to
        another application or class, or names an unknown, deleted or
        confidential application. The single exception: one person and one
        application hold at most 1,000 revoked access tokens that have not yet
        expired, a deliberately high fixed ceiling against abuse. Revoking a
        genuine, unexpired access token beyond it is answered 503
        `temporarily_unavailable` and the token is not recorded as revoked;
        only a caller already holding that valid token can observe this.


        A malformed field, body or content type is answered 400
        `invalid_request`; more than 64 public-protocol requests in progress
        on the worker 503 `temporarily_unavailable`; and an internal failure
        500 `server_error`. Every answer carries `Cache-Control: no-store` and
        `Pragma: no-cache`.
      x-abandonauth-served: false
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRevocation"
      responses:
        "200":
          description: The token is no longer accepted by AbandonAuth. The response has no body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
        "400":
          $ref: "#/components/responses/OAuthInvalidRequest"
        "500":
          $ref: "#/components/responses/OAuthServerError"
        "503":
          $ref: "#/components/responses/OAuthTemporarilyUnavailable"

  /api/create_test_user:
    post:
      tags: [Development Sign-In]
      summary: Create a password account for local development
      description: >-
        Development-only. Create an account that signs in with a password, for
        local development without a provider. A password that cannot be stored,
        because it is empty or longer than 72 bytes, is answered 400.


        This operation exists only in a development build compiled with the
        `devtools` tag, running with debug mode on and a loopback-only
        listener. A deployment build contains neither the route nor the handler
        and answers 404, as does a development build missing either of the
        other two conditions.
      x-abandonauth-build: development
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAccount"
      responses:
        "200":
          description: The account that was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/DevelopmentOperationUnavailable"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/login_test_user:
    post:
      tags: [Development Sign-In]
      summary: Sign in with a password for local development
      description: >-
        Development-only. Sign the browser in as a password account. The
        browser receives the same session and CSRF cookies a provider sign-in
        to the AbandonAuth site gives, and the answer carries a user access
        token for the site. No cookie is set unless the whole sign-in
        succeeds. A wrong password and an unknown account are refused with the
        same 401.


        This operation exists only in a development build compiled with the
        `devtools` tag, running with debug mode on and a loopback-only
        listener. A deployment build contains neither the route nor the handler
        and answers 404, as does a development build missing either of the
        other two conditions.
      x-abandonauth-build: development
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLogin"
      responses:
        "200":
          description: A user access token for the AbandonAuth site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DevelopmentOperationUnavailable"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    UserAccessToken:
      bearerFormat: JWT
      description: >-
        A `user_access` token, sent in the `Authorization` header with the
        `Bearer` scheme. Its subject is the authenticated user and its audience
        is one developer application. It is obtained at `POST /api/login` and
        expires fifteen minutes after it is issued. It can be withdrawn early
        at `POST /api/burn-token`, and every token is withdrawn when the
        service's authority is rotated.


        Each operation checks its scope and audience exactly: some accept a
        token for any still-registered application carrying `identify`, others
        only a token for the AbandonAuth site carrying `abandonauth`. This
        token is never accepted where a `DeveloperApplicationAccessToken` is
        required, and that token is never accepted in its place. Nor is an
        `OIDCAccessToken`.
      scheme: bearer
      type: http
    DeveloperApplicationAccessToken:
      bearerFormat: JWT
      description: >-
        A `developer_application_access` token, sent in the `Authorization`
        header with the `Bearer` scheme. It authenticates a developer
        application as the principal: its subject is the application, its
        audience is the AbandonAuth site, and it carries exactly the
        `abandonauth` and `identify` scopes. It
        is obtained at `POST /api/developer_application/login`, expires fifteen
        minutes after it is issued, and is bound to the application's
        credential version, so resetting the refresh token refuses every token
        issued before the reset.


        This token is never accepted where a `UserAccessToken` is required,
        and that token is never accepted in its place. Nor is an
        `OIDCAccessToken`. A public client can never obtain this token.
      scheme: bearer
      type: http
    OIDCAccessToken:
      bearerFormat: JWT
      description: >-
        An RFC 9068 access token issued to a public client at
        `POST /api/oauth/token`, sent in the `Authorization` header with the
        `Bearer` scheme. Its header carries `typ` `at+jwt`, `alg` `RS256` and
        the `kid` of a key published only at `GET /api/oauth/access-jwks`. Its
        issuer is the OpenID issuer, its subject the pairwise subject, its
        audience the client identifier as one string, and it carries `iat`,
        `nbf`, `exp`, a UUID `jti`, `client_id`, the canonical granted `scope`
        and `auth_epoch`, and never a username or an AbandonAuth user
        identifier. It expires exactly fifteen minutes after it is issued.


        AbandonAuth's own UserInfo refuses it at once after revocation,
        deletion of its application or user, or authority rotation. A resource
        server validating it locally cannot learn of those and accepts a
        correctly signed token until it expires: within this profile a token
        stays usable elsewhere for up to fifteen minutes after it is withdrawn.
        Validators allow no clock tolerance, so any real clock error adds
        directly to that window and synchronized UTC clocks are an operator
        responsibility.


        This token is never accepted where a `UserAccessToken` or a
        `DeveloperApplicationAccessToken` is required, and neither of those is
        ever accepted in its place.
      scheme: bearer
      type: http
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-abandonauth_session
      description: >-
        The browser session cookie set when a user signs in to the AbandonAuth
        site. The cookie holds a random value; the server stores only its
        digest, with the user ID and a CSRF token digest. Expiry is absolute and
        is not extended by use. Logout deletes the session on the server.


        Over HTTPS the cookie is `__Host-abandonauth_session` with `HttpOnly`,
        `Secure`, `SameSite=Lax`, `Path=/` and no `Domain`. Beside it the
        readable `__Host-abandonauth_csrf` cookie, with the same attributes
        except `HttpOnly`, carries the CSRF token the site copies into a
        header. Only in a development build running in debug mode with the
        site itself on a loopback address without TLS are the cookies named
        `abandonauth_session` and `abandonauth_csrf`, without the `__Host-`
        prefix or `Secure`. A deployment build always sets the prefixed
        `Secure` cookies, on a loopback HTTPS origin too.


        A browser-authenticated request that changes state additionally
        requires the exact site `Origin`, a non-empty `X-CSRF-Token`, equality
        between that header and the readable CSRF cookie, and a match to the
        CSRF digest bound to the server-side session. A request that sends an
        `Authorization` header is authenticated by that header and never by
        this cookie, and needs neither `Origin` nor `X-CSRF-Token`.

  parameters:
    ApplicationIdPath:
      name: application_id
      in: path
      required: true
      description: The developer application's identifier.
      schema:
        type: string
        format: uuid
    ApplicationIdQuery:
      name: application_id
      in: query
      required: true
      description: The developer application the person is signing in to.
      schema:
        type: string
        format: uuid
    CallbackURIQuery:
      name: callback_uri
      in: query
      required: true
      description: >-
        Exactly one of the callback URIs the application registered, in its
        exact registered spelling.
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      description: The provider to sign in with.
      schema:
        type: string
        enum: [discord, github, google, steam]
    State:
      name: state
      in: query
      required: true
      description: >-
        The opaque login state this service put in the authorization request.
        A missing state is refused like any other unmatched one.
      schema:
        type: string
    ProviderAuthorizationCode:
      name: code
      in: query
      required: false
      description: >-
        The authorization code the provider issued. Absent when the person
        declined or the provider sent them back without one.
      schema:
        type: string
    OpenIDNamespace:
      name: openid.ns
      in: query
      required: true
      description: Exactly `http://specs.openid.net/auth/2.0`.
      schema:
        type: string
    OpenIDMode:
      name: openid.mode
      in: query
      required: true
      description: >-
        `id_res` for a positive assertion, or `cancel` when the person declined
        at Steam or Steam sent them back without signing them in. Any other
        mode is refused with the 403 before the state is consumed.
      schema:
        type: string
        enum: [id_res, cancel]
    OpenIDProviderEndpoint:
      name: openid.op_endpoint
      in: query
      required: false
      description: >-
        Required in a positive assertion and signed: exactly
        `https://steamcommunity.com/openid/login`.
      schema:
        type: string
    OpenIDClaimedID:
      name: openid.claimed_id
      in: query
      required: false
      description: >-
        Required in a positive assertion and signed:
        `https://steamcommunity.com/openid/id/` followed by the person's Steam
        ID.
      schema:
        type: string
    OpenIDIdentity:
      name: openid.identity
      in: query
      required: false
      description: >-
        Required in a positive assertion and signed: equal to
        `openid.claimed_id`.
      schema:
        type: string
    OpenIDReturnTo:
      name: openid.return_to
      in: query
      required: false
      description: >-
        Required in a positive assertion and signed: this address with the
        request's `state` appended.
      schema:
        type: string
    OpenIDResponseNonce:
      name: openid.response_nonce
      in: query
      required: false
      description: >-
        Required in a positive assertion and signed: a UTC timestamp ending in
        `Z`, then a non-empty uniqueness value.
      schema:
        type: string
    OpenIDAssociationHandle:
      name: openid.assoc_handle
      in: query
      required: false
      description: Required, and non-empty, in a positive assertion.
      schema:
        type: string
    OpenIDSigned:
      name: openid.signed
      in: query
      required: false
      description: >-
        Required in a positive assertion: the comma-separated fields Steam
        signed, covering at least `op_endpoint`, `claimed_id`, `identity`,
        `return_to` and `response_nonce`.
      schema:
        type: string
    OpenIDSignature:
      name: openid.sig
      in: query
      required: false
      description: >-
        Required, and non-empty, in a positive assertion. This service does not
        check it itself; Steam does, when asked to verify the assertion.
      schema:
        type: string
    ExchangeToken:
      name: exchange-token
      in: header
      required: true
      description: >-
        The one-time code a provider callback returned the browser with.
      schema:
        type: string
    ConditionalOrigin:
      name: Origin
      in: header
      required: false
      description: >-
        Required when the request is authenticated by `BrowserSession`, and
        then must be exactly the AbandonAuth site's origin. Not needed when the
        request is authenticated by an `Authorization` header.
      schema:
        type: string
    ConditionalCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        Required when the request is authenticated by `BrowserSession`, and
        then must equal the readable CSRF cookie and match the CSRF digest
        bound to the server-side session. Not needed when the request is
        authenticated by an `Authorization` header.
      schema:
        type: string
    RequiredOrigin:
      name: Origin
      in: header
      required: true
      description: Exactly the AbandonAuth site's origin.
      schema:
        type: string
    RequiredCSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >-
        The value of the readable CSRF cookie, which must match the CSRF digest
        bound to the server-side session.
      schema:
        type: string
    AuthorizationResponseType:
      name: response_type
      in: query
      required: true
      description: Exactly `code`, once.
      schema:
        type: string
        enum: [code]
    AuthorizationClientID:
      name: client_id
      in: query
      required: true
      description: >-
        The public client's identifier, once, as a canonical lower-case
        hyphenated 36-character UUID.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    AuthorizationRedirectURI:
      name: redirect_uri
      in: query
      required: true
      description: >-
        One of the client's registered loopback templates with exactly one
        numeric port from 1 through 65535 added and nothing else changed, at
        most 2,048 UTF-8 bytes once decoded. Its exact spelling is stored and
        must be presented again, byte for byte, when the code is redeemed.
      schema:
        type: string
    AuthorizationScope:
      name: scope
      in: query
      required: true
      description: >-
        `openid`, optionally with `profile` and `offline_access`, separated by
        single spaces with none leading or trailing and none repeated, at most
        64 bytes. Granted scopes are always reported in the order `openid
        profile offline_access` with ungranted ones omitted. `profile`
        releases `preferred_username`; `offline_access` issues a refresh
        token.
      schema:
        type: string
        maxLength: 64
    AuthorizationState:
      name: state
      in: query
      required: true
      description: >-
        The client's own unpredictable value, returned unchanged in the
        authorization response: 43 to 128 unpadded base64url characters.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43,128}$"
    AuthorizationNonce:
      name: nonce
      in: query
      required: true
      description: >-
        The client's own unpredictable value, returned in the ID token issued
        for the code: 43 to 128 unpadded base64url characters.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43,128}$"
    AuthorizationCodeChallenge:
      name: code_challenge
      in: query
      required: true
      description: >-
        The RFC 7636 `S256` challenge: the unpadded base64url SHA-256 of the
        client's verifier, exactly 43 characters.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    AuthorizationCodeChallengeMethod:
      name: code_challenge_method
      in: query
      required: true
      description: >-
        Exactly `S256`. `plain` and an omitted method are refused, so no
        challenge can be downgraded.
      schema:
        type: string
        enum: [S256]
    AuthorizationResponseMode:
      name: response_mode
      in: query
      required: false
      description: Exactly `query` when present.
      schema:
        type: string
        enum: [query]
    AuthorizationRequestHandle:
      name: request
      in: path
      required: true
      description: >-
        The opaque page handle the authorization page read from its address
        fragment: exactly 43 unpadded base64url characters. It is single-use,
        stored only as a digest, and expires with its authorization five
        minutes after it began.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    NativeAuthorizationBinding:
      name: __Host-abandonauth_native_oauth
      in: cookie
      required: true
      description: >-
        The browser binding a public client's authorization was started with.
        It holds a random value; the server stores only its digest. It is
        separate from the cookie a confidential sign-in uses, so authorizations
        and sign-ins in other tabs never overwrite one another. It carries
        `HttpOnly`, `Secure`, `SameSite=Lax`, `Path=/` and no `Domain`, and
        expires five minutes after it was last set. Only in a development
        build running in debug mode with the site on a loopback address
        without TLS is it named `abandonauth_native_oauth`, without the
        `__Host-` prefix or `Secure`. Several cookies of this name with
        different values, or a malformed value, match nothing.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    NativeAuthorizationBindingOptional:
      name: __Host-abandonauth_native_oauth
      in: cookie
      required: false
      description: >-
        A binding this browser already holds from another public client
        authorization begun within five minutes. When it is syntactically
        valid it is reused and its expiry renewed; otherwise a new one is
        issued. See `NativeAuthorizationBinding`.
      schema:
        type: string

  headers:
    Location:
      description: Where the browser is sent.
      schema:
        type: string
    Retry-After:
      description: Whole seconds to wait before the budget allows another change.
      schema:
        type: integer
        minimum: 1
    CacheControlNoStore:
      description: The answer must not be stored by any cache.
      schema:
        type: string
        enum: [no-store]
    CacheControlFiveMinutes:
      description: The answer may be cached for five minutes.
      schema:
        type: string
        enum: ["public, max-age=300"]
    PragmaNoCache:
      description: The answer must not be cached, for caches that read only this header.
      schema:
        type: string
        enum: [no-cache]
    ReferrerPolicyNoReferrer:
      description: No address is sent as a referrer from what this answer leads to.
      schema:
        type: string
        enum: [no-referrer]
    FrameOptionsDeny:
      description: The answer may not be displayed in a frame.
      schema:
        type: string
        enum: [DENY]
    ContentSecurityPolicyNoFraming:
      description: No page may frame the answer.
      schema:
        type: string
        enum: ["frame-ancestors 'none'"]
    InvalidTokenChallenge:
      description: The fixed challenge. It never quotes the token or a claim.
      schema:
        type: string
        enum: ['Bearer error="invalid_token"']
    InsufficientScopeChallenge:
      description: The fixed challenge. It never quotes the token or a claim.
      schema:
        type: string
        enum: ['Bearer error="insufficient_scope", scope="openid"']

  schemas:
    TokenResponse:
      type: object
      description: An access token.
      required: [token]
      properties:
        token:
          type: string
    User:
      type: object
      description: What an application may learn about the person who signed in.
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    ClientType:
      type: string
      enum: [confidential, public]
      description: >-
        The RFC 6749 client type, fixed when the application is registered. A
        `confidential` application is a server-side application that can
        protect a credential. A `public` client is an installed application
        that cannot protect a shared credential and holds none.
    DeveloperApplication:
      type: object
      description: A developer application.
      required: [id, name, owner_id, client_type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        client_type:
          $ref: "#/components/schemas/ClientType"
    DeveloperApplicationWithCallbackURIs:
      type: object
      description: A developer application and the exact URIs it may be returned to.
      required: [id, name, owner_id, client_type, callback_uris]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        client_type:
          $ref: "#/components/schemas/ClientType"
        callback_uris:
          type: array
          items:
            type: string
    DeveloperApplicationWithCredential:
      type: object
      description: >-
        A confidential developer application and its refresh token. The
        refresh token is returned only once, in this answer; it is stored as a
        hash and cannot be read back.
      required: [id, name, owner_id, client_type, token]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        client_type:
          type: string
          enum: [confidential]
        token:
          type: string
          description: The application's refresh token.
    RegisteredDeveloperApplication:
      type: object
      description: >-
        A newly registered developer application. A confidential application's
        answer carries its refresh token, returned only once; it is stored as
        a hash and cannot be read back. A public client's answer carries no
        `token`, because it has no credential.
      required: [id, name, owner_id, client_type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        client_type:
          $ref: "#/components/schemas/ClientType"
        token:
          type: string
          description: >-
            The application's refresh token. Present exactly when
            `client_type` is `confidential`.
    DeveloperApplicationRegistration:
      type: object
      description: The developer application to register.
      required: [name]
      properties:
        name:
          type: string
        client_type:
          type: string
          enum: [confidential, public]
          description: >-
            The application's client type, which can never be changed. When
            omitted the application is `confidential`.
    DeveloperApplicationCredentials:
      type: object
      description: A developer application's identifier and refresh token.
      required: [id, refresh_token]
      properties:
        id:
          type: string
          format: uuid
        refresh_token:
          type: string
    CredentialWithdrawal:
      type: object
      description: A credential to withdraw.
      required: [token]
      properties:
        token:
          type: string
          description: An access token or a one-time code.
    PasswordAccount:
      type: object
      description: Development-only. The password account to create.
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    PasswordLogin:
      type: object
      description: Development-only. The password account to sign in as.
      required: [user_id, password]
      properties:
        user_id:
          type: string
          format: uuid
        password:
          type: string
    Failure:
      type: object
      description: >-
        A refusal, with one human-readable detail written by this service. The
        detail never repeats a request value. It is not a stable
        machine-readable code and may change; classify a refusal by its HTTP
        status.
      required: [detail]
      properties:
        detail:
          type: string
    InputFailure:
      type: object
      description: >-
        One input a request was refused for. `loc` and `type` identify the
        refusal; `msg` is human-readable, is not a stable machine-readable code
        and may change.
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          description: >-
            Where the input was found, from outermost to innermost: the part of
            the request, then the field, then the index within it.
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
          description: >-
            A human-readable description of the refusal that never repeats the
            refused value.
        type:
          type: string
          description: The category of refusal, such as `missing` or `uuid_parsing`.
    Invalidated:
      type: object
      description: A refusal for the request's inputs, listing each one.
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/InputFailure"
    OpenIDProviderMetadata:
      type: object
      description: >-
        Exactly these members, describing exactly the implemented profile.
        Every address is the issuer followed by a fixed path.
      additionalProperties: false
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - userinfo_endpoint
        - revocation_endpoint
        - jwks_uri
        - access_token_jwks_uri
        - response_types_supported
        - response_modes_supported
        - grant_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - scopes_supported
        - token_endpoint_auth_methods_supported
        - revocation_endpoint_auth_methods_supported
        - code_challenge_methods_supported
        - authorization_response_iss_parameter_supported
      properties:
        issuer:
          type: string
          description: >-
            `ABANDON_AUTH_URL` followed by `/api`, in the origin's registered
            spelling and with no trailing slash.
        authorization_endpoint:
          type: string
          description: The issuer followed by `/oauth/authorize`.
        token_endpoint:
          type: string
          description: The issuer followed by `/oauth/token`.
        userinfo_endpoint:
          type: string
          description: The issuer followed by `/oauth/userinfo`.
        revocation_endpoint:
          type: string
          description: The issuer followed by `/oauth/revoke`.
        jwks_uri:
          type: string
          description: >-
            The issuer followed by `/oidc/jwks`: the ID token key set, and only
            that.
        access_token_jwks_uri:
          type: string
          description: >-
            The issuer followed by `/oauth/access-jwks`: the access token key
            set, and only that. A resource server validates access tokens
            against this set alone.
        response_types_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [code]
        response_modes_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [query]
        grant_types_supported:
          type: array
          description: Exactly `authorization_code` then `refresh_token`.
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [authorization_code, refresh_token]
        subject_types_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [pairwise]
        id_token_signing_alg_values_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [RS256]
        scopes_supported:
          type: array
          description: Exactly `openid`, `profile` then `offline_access`.
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [openid, profile, offline_access]
        token_endpoint_auth_methods_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [none]
        revocation_endpoint_auth_methods_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [none]
        code_challenge_methods_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [S256]
        authorization_response_iss_parameter_supported:
          type: boolean
          enum: [true]
    JSONWebKeySet:
      type: object
      description: One purpose's public verification keys, and nothing else.
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/RSAPublicJSONWebKey"
    RSAPublicJSONWebKey:
      type: object
      description: >-
        One public RSA signing key with exactly these members. No private
        member is ever published.
      additionalProperties: false
      required: [kid, kty, use, alg, n, e]
      properties:
        kid:
          type: string
          description: The RFC 7638 thumbprint of `kty`, `n` and `e`.
          pattern: "^[A-Za-z0-9_-]{43}$"
        kty:
          type: string
          enum: [RSA]
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          enum: [RS256]
        n:
          type: string
          description: The modulus, unpadded base64url, of at least 2048 bits.
          pattern: "^[A-Za-z0-9_-]+$"
        e:
          type: string
          description: The public exponent, unpadded base64url.
          pattern: "^[A-Za-z0-9_-]+$"
    PendingAuthorization:
      type: object
      description: >-
        What the authorization page displays, and nothing else. The offline
        session it describes lasts up to 90 days; one person can hold ten
        active offline sessions with one application, and another grant ends
        the least recently created. `profile` releases the username, which
        can be the same at every application.
      additionalProperties: false
      required: [application_name, scopes, expires_at, providers]
      properties:
        application_name:
          type: string
          description: The name the application was registered under, to be shown as text.
        scopes:
          type: array
          description: The requested scopes, in the order `openid`, `profile`, `offline_access`.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [openid, profile, offline_access]
        expires_at:
          type: string
          format: date-time
          description: >-
            When the request expires: five minutes after the authorization
            began, in UTC, with whole seconds and a trailing `Z`.
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        providers:
          type: array
          description: Exactly `discord`, `github`, `google` then `steam`.
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [discord, github, google, steam]
    AuthorizationCodeGrant:
      type: object
      description: >-
        Redeem a native authorization code. Each member appears exactly once.
      required: [grant_type, client_id, code, redirect_uri, code_verifier]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        client_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        code:
          type: string
          description: The authorization code, exactly 43 unpadded base64url characters.
          pattern: "^[A-Za-z0-9_-]{43}$"
        redirect_uri:
          type: string
          description: >-
            Byte for byte the redirect URI, port included, the authorization
            was begun with, at most 2,048 UTF-8 bytes.
        code_verifier:
          type: string
          description: The RFC 7636 verifier, 43 to 128 unreserved characters.
          pattern: "^[A-Za-z0-9._~-]{43,128}$"
    RefreshTokenGrant:
      type: object
      description: >-
        Rotate a refresh token. Each member appears at most once.
      required: [grant_type, client_id, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        client_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        refresh_token:
          type: string
          description: The refresh token, exactly 43 unpadded base64url characters.
          pattern: "^[A-Za-z0-9_-]{43}$"
        scope:
          type: string
          description: >-
            A narrowing of the granted scopes that still contains `openid`,
            under the same spelling rules as the authorization request. When
            omitted the grant is kept.
          maxLength: 64
    TokenRevocation:
      type: object
      description: A token to revoke. `client_id` and `token` appear exactly once.
      required: [client_id, token]
      properties:
        client_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        token:
          type: string
          description: A refresh token or an OIDC access token, at most 8,192 bytes.
          maxLength: 8192
        token_type_hint:
          type: string
          description: >-
            Accepted any number of times with any value, and never read: it
            neither selects nor suppresses a lookup.
    TokenSet:
      type: object
      description: >-
        Exactly these members. `refresh_token` and `refresh_token_expires_in`
        are present exactly when `offline_access` is granted.
      additionalProperties: false
      required: [access_token, token_type, expires_in, id_token, scope]
      properties:
        access_token:
          type: string
          description: An `OIDCAccessToken`, whose claims are `AccessTokenClaims`.
          maxLength: 8192
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: The access token's lifetime in seconds, always 900.
          enum: [900]
        id_token:
          type: string
          description: An ID token, whose claims are `IDTokenClaims`.
          maxLength: 8192
        scope:
          type: string
          description: >-
            The granted scopes in the order `openid profile offline_access`,
            ungranted ones omitted.
        refresh_token:
          type: string
          description: >-
            The opaque rotating refresh token, exactly 43 unpadded base64url
            characters. Store it in the operating system's secure storage.
          pattern: "^[A-Za-z0-9_-]{43}$"
        refresh_token_expires_in:
          type: integer
          description: >-
            Whole seconds until this refresh token expires, measured by the
            database clock of the issuing transaction and rounded down.
          minimum: 1
          maximum: 2592000
    IDTokenClaims:
      type: object
      description: >-
        The payload of an ID token, with exactly these claims. Its header
        carries `alg` `RS256`, `typ` `JWT` and the `kid` of a key in the ID
        token key set at `jwks_uri`. It is valid for exactly five minutes from
        `iat`. A validator rejects `typ` `at+jwt` and any access token claim.
      additionalProperties: false
      required: [iss, sub, aud, exp, iat, auth_time]
      properties:
        iss:
          type: string
          description: The issuer.
        sub:
          $ref: "#/components/schemas/PairwiseSubject"
        aud:
          type: string
          description: The client identifier, as one string.
        exp:
          type: integer
        iat:
          type: integer
        auth_time:
          type: integer
          description: When the provider authenticated the person, kept across refreshes.
        nonce:
          type: string
          description: >-
            The authorization request's nonce. Present on the ID token issued
            for a code and absent from every refreshed ID token.
        preferred_username:
          type: string
          description: Present only when `profile` is granted.
    AccessTokenClaims:
      type: object
      description: >-
        The payload of an `OIDCAccessToken`, with exactly these claims. Its
        header carries `typ` `at+jwt`, `alg` `RS256` and the `kid` of a key in
        the access token key set at `access_token_jwks_uri`. `nbf` and `iat`
        are equal and `exp` is exactly 900 seconds later; validators allow no
        clock tolerance. A resource server requires `auth_epoch`, `client_id`
        and `jti` to be canonical lower-case UUIDs but does not compare
        `auth_epoch` with the current authority: the token stays valid until
        it expires.
      additionalProperties: false
      required: [iss, sub, aud, client_id, scope, jti, auth_epoch, iat, nbf, exp]
      properties:
        iss:
          type: string
          description: The issuer.
        sub:
          $ref: "#/components/schemas/PairwiseSubject"
        aud:
          type: string
          description: The client identifier, as one string.
        client_id:
          type: string
          format: uuid
        scope:
          type: string
          description: The granted scopes in canonical order.
        jti:
          type: string
          format: uuid
        auth_epoch:
          type: string
          format: uuid
        iat:
          type: integer
        nbf:
          type: integer
        exp:
          type: integer
    PairwiseSubject:
      type: string
      description: >-
        The person's identifier at one application: 32 random bytes as exactly
        43 unpadded base64url characters, stable for that person and
        application, different at every other application, and never the
        AbandonAuth user identifier.
      pattern: "^[A-Za-z0-9_-]{43}$"
    UserInfo:
      type: object
      description: The claims an `OIDCAccessToken`'s grant releases, and no others.
      additionalProperties: false
      required: [sub]
      properties:
        sub:
          $ref: "#/components/schemas/PairwiseSubject"
        preferred_username:
          type: string
          description: Present only when `profile` is granted.
    OAuthErrorInvalidRequest:
      type: object
      description: An OAuth refusal with only its code and no description.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request]
    OAuthErrorToken:
      type: object
      description: An OAuth refusal with only its code and no description.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, unsupported_grant_type, invalid_client, invalid_grant, invalid_scope]
    OAuthErrorServer:
      type: object
      description: An OAuth refusal with only its code and no description.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [server_error]
    OAuthErrorTemporarilyUnavailable:
      type: object
      description: An OAuth refusal with only its code and no description.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [temporarily_unavailable]
    OAuthErrorInvalidToken:
      type: object
      description: An OAuth refusal with only its code and no description.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_token]
    OAuthErrorInsufficientScope:
      type: object
      description: An OAuth refusal with only its code and no description.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [insufficient_scope]

  responses:
    BadRequest:
      description: The input was well formed but cannot be accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    Unauthorized:
      description: >-
        Application authentication was missing, or the credentials or one-time
        exchange code presented were not accepted. An unknown principal and a
        wrong credential receive the same response, as do an unknown, spent,
        expired and misdirected exchange code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    Forbidden:
      description: >-
        Authentication or authorization failed: a credential was missing, the
        `Authorization` header was malformed, an access token was expired,
        invalid, withdrawn or of the wrong class, issuer, scope or audience, a
        CSRF check failed, or a sign-in could not be started or validated. An
        expired access token is reported separately; every other access token
        refusal, including a withdrawn token, a stale auth epoch and a
        principal that no longer exists, receives the same response. No
        response reveals whether an account or application exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    ApplicationNotFound:
      description: >-
        No developer application with this identifier is owned by the
        signed-in person. One owned by somebody else is answered the same way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    DevelopmentOperationUnavailable:
      description: >-
        The operation is unavailable: this is a deployment build, or a
        development build without debug mode or without a loopback-only
        listener.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    InvalidInput:
      description: The request's inputs were refused; each one is listed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Invalidated"
    TooManyRequests:
      description: The authenticated user's rate limit for this kind of change is exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    Unavailable:
      description: The request could not be answered. Nothing about the cause is disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    RedirectToProvider:
      description: >-
        The browser is sent to the provider's fixed HTTPS authorization
        address. Of the login this service holds, only the opaque state, the
        PKCE challenge for an OAuth provider and, for Google, the nonce travel
        in it; Steam is sent only the opaque state, inside the return address.
        The response has no body.
      headers:
        Location:
          $ref: "#/components/headers/Location"
    RedirectToCallback:
      description: >-
        The browser is sent to the application's exact registered callback.
        The response has no body.
      headers:
        Location:
          $ref: "#/components/headers/Location"
    PublicClientHasNoCredential:
      description: >-
        The application is a public client, which has no credential to
        replace. The detail is always `Public client has no credential`, and
        nothing is changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    AuthorizationRequestUnavailable:
      description: >-
        No pending authorization matches: the handle is unknown, expired,
        consumed or malformed, or this browser does not hold the binding it
        was bound to. Every case receives the same detail, `Authorization
        request unavailable`, and nothing is consumed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Referrer-Policy:
          $ref: "#/components/headers/ReferrerPolicyNoReferrer"
        X-Frame-Options:
          $ref: "#/components/headers/FrameOptionsDeny"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicyNoFraming"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    AuthorizationRequestForbidden:
      description: >-
        The request did not carry exactly the AbandonAuth site's `Origin`. The
        detail is always `Authorization request forbidden`, and nothing is
        consumed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Referrer-Policy:
          $ref: "#/components/headers/ReferrerPolicyNoReferrer"
        X-Frame-Options:
          $ref: "#/components/headers/FrameOptionsDeny"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicyNoFraming"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    ServiceTemporarilyUnavailable:
      description: >-
        The worker already has 64 public-protocol requests in progress. The
        detail is always `Service temporarily unavailable`; nothing was read,
        consumed or changed, and the request can be retried.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Failure"
    OAuthInvalidRequest:
      description: >-
        The request was malformed. For `GET /api/oauth/authorize` this is the
        direct refusal of an unproven client or redirect, sent with no
        `Location`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Pragma:
          $ref: "#/components/headers/PragmaNoCache"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorInvalidRequest"
    OAuthTokenRefused:
      description: >-
        The token request was refused. The code says why, as the operation
        describes; nothing else is disclosed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Pragma:
          $ref: "#/components/headers/PragmaNoCache"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorToken"
    OAuthServerError:
      description: The request could not be answered. Nothing about the cause is disclosed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Pragma:
          $ref: "#/components/headers/PragmaNoCache"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorServer"
    OAuthTemporarilyUnavailable:
      description: >-
        The worker already has 64 public-protocol requests in progress, or,
        for revocation, the fixed ceiling of revoked access tokens is reached.
        Nothing was consumed, and the request can be retried.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Pragma:
          $ref: "#/components/headers/PragmaNoCache"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorTemporarilyUnavailable"
    OAuthInvalidToken:
      description: The access token was missing or is not accepted.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/InvalidTokenChallenge"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Pragma:
          $ref: "#/components/headers/PragmaNoCache"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorInvalidToken"
    OAuthInsufficientScope:
      description: The access token does not carry the `openid` scope.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/InsufficientScopeChallenge"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Pragma:
          $ref: "#/components/headers/PragmaNoCache"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorInsufficientScope"
    AuthorizationStarted:
      description: >-
        On success, the browser is sent to the AbandonAuth site's origin
        followed by `/authorize#request=` and the page handle, and receives
        the binding cookie. On a refusal after the client and redirect are
        proven, it is sent to the exact redirect with only `error`, the valid
        `state` and `iss`. The response has no body.
      headers:
        Location:
          $ref: "#/components/headers/Location"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Referrer-Policy:
          $ref: "#/components/headers/ReferrerPolicyNoReferrer"
        X-Frame-Options:
          $ref: "#/components/headers/FrameOptionsDeny"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicyNoFraming"
    RedirectFromPageToProvider:
      description: >-
        The browser is sent to the provider's fixed HTTPS authorization
        address, carrying only the opaque provider state, the PKCE challenge
        for an OAuth provider and, for Google, the nonce; Steam is sent only
        the opaque state, inside the return address. The response has no
        body.
      headers:
        Location:
          $ref: "#/components/headers/Location"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Referrer-Policy:
          $ref: "#/components/headers/ReferrerPolicyNoReferrer"
        X-Frame-Options:
          $ref: "#/components/headers/FrameOptionsDeny"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicyNoFraming"
    RedirectToPublicClient:
      description: >-
        The browser is sent to the public client's validated loopback redirect,
        rebuilt from its exact stored spelling with no existing byte
        rewritten and each response parameter encoded and appended: `code`,
        `state` and `iss` on success, or `error`, `state` and `iss` on a
        refusal. No token is ever put in this address. The response has no
        body.
      headers:
        Location:
          $ref: "#/components/headers/Location"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Referrer-Policy:
          $ref: "#/components/headers/ReferrerPolicyNoReferrer"
        X-Frame-Options:
          $ref: "#/components/headers/FrameOptionsDeny"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicyNoFraming"
