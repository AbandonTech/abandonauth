  /api/.well-known/openid-configuration:
    get:
      tags: [OpenID Connect]
      summary: Describe this OpenID Provider
      description: >-
        OpenID Connect Discovery metadata. The issuer is exactly
        `ABANDON_AUTH_URL` followed by `/api`, in the origin's registered
        spelling and with no trailing slash; it is not the issuer of the
        `UserAccessToken` or `DeveloperApplicationAccessToken` classes. A
        client pins that expected issuer, fetches this document only from the
        location derived from it, and requires its `issuer` to equal the
        expected issuer byte for byte before trusting any endpoint or key it
        names.


        The document advertises only the implemented profile: response type
        `code`, response mode `query`, grant types `authorization_code` and
        `refresh_token`, token and revocation endpoint authentication method
        `none`, scopes `openid`, `profile` and `offline_access`, subject type
        `pairwise`, ID token signing algorithm `RS256`, PKCE method `S256`,
        and RFC 9207 issuer identification in the authorization response. It
        publishes no dynamic registration, introspection, DPoP, device
        authorization or logout capability.


        Standard `jwks_uri` names only the ID token key set. The extension
        member `access_token_jwks_uri` names only the access token key set. A
        validator trusts only the set for the token class it validates and
        never tries a key from one set against the other class.
