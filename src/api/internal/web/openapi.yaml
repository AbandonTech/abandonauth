openapi: "3.1.0"
info:
  title: AbandonAuth
  version: "0.0.1"
  description: Identity provider and OAuth application broker.
tags:
  - name: Users
    description: The authenticated user, and the developer applications that user owns.
  - name: Authentication
    description: >-
      Starting provider sign-ins, spending one-time codes, withdrawing
      credentials and ending browser sessions.
  - name: Developer Applications
    description: >-
      Applications that send people here to sign in, their credentials and the
      exact callback URIs they may be returned to.
  - name: Provider Callbacks
    description: >-
      The addresses Discord, GitHub, Google and Steam return a browser to. Only
      a browser following a provider's redirect calls them.
  - name: OpenID Connect
    description: >-
      Installed public clients signing a person in through the system browser
      with OpenID Connect Authorization Code flow and PKCE `S256`: discovery,
      the two purpose-specific key sets, authorization, token, UserInfo and
      revocation. No public client holds a secret.
  - name: Authorization Page
    description: >-
      What the AbandonAuth site's authorization page reads and submits for a
      public client's pending authorization: the sanitized request, the
      provider choice and cancellation.
  - name: Development Sign-In
    description: >-
      Password accounts for local development without a provider. A deployment
      build contains neither route nor handler, and answers both addresses 404.

paths:
  /api/me:
    get:
      tags: [Users]
      summary: Describe the authenticated user
      description: >-
        Describe the user a user access token or browser session authenticates.


        With `UserAccessToken`, the token must carry the `identify` scope and
        its audience must be a developer application that is still registered;
        a token whose audience application has since been deleted is refused.
        A developer application access token is refused here.


        With `BrowserSession`, the session cookie alone authenticates the user.
        A request that sends an `Authorization` header is authenticated by that
        header and never by the cookie.
      security:
        - UserAccessToken: []
        - BrowserSession: []
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/user/applications:
    get:
      tags: [Users]
      summary: List the signed-in person's developer applications
      description: >-
        List every developer application the signed-in person owns.


        With `UserAccessToken`, the token must have been issued to the
        AbandonAuth site itself and carry the `abandonauth` scope. A token any
        other application holds is refused, so an application cannot read what
        else its user has registered. A developer application access token is
        refused here.


        With `BrowserSession`, the session cookie alone authenticates the user.
        A request that sends an `Authorization` header is authenticated by that
        header and never by the cookie.
      security:
        - UserAccessToken: []
        - BrowserSession: []
      responses:
        "200":
          description: The applications the person owns, possibly none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeveloperApplication"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/login:
    post:
      tags: [Authentication]
      summary: Spend a one-time code for a user access token
      description: >-
        Spend the one-time code a provider callback returned the browser with,
        for a user access token whose subject is the user who signed in and
        whose audience is the collecting application. The token expires fifteen
        minutes after it is issued.


        Application proof is mandatory. The collecting application
        authenticates either with its own `DeveloperApplicationAccessToken` in
        the `Authorization` header, or, when no `Authorization` header is sent,
        with its `DeveloperApplicationCredentials` in the body. A present
        `Authorization` header takes precedence: if it is malformed or refused,
        the request is refused and never falls back to the body credentials.
        With no `Authorization` header and no body, or a body of JSON `null`,
        the request is refused with 401. A body that is present must carry both
        `id` and `refresh_token`; body credentials that are not accepted are
        refused with the same 403 for an unknown application and a wrong
        refresh token.


        The code must have been issued to the authenticated application.
        Spending it is one atomic delete, so a code is spent at most once: a
        replayed code, an expired code, a code issued to another application
        and a code never issued are all refused with the same 401, whether the
        second attempt arrives later or at the same instant on another worker.


        Only a confidential application spends a code here. A public client
        has no credential, so its identifier is refused with the same 403 as a
        wrong refresh token, and it is never issued a code this operation
        accepts.
      security:
        - DeveloperApplicationAccessToken: []
      parameters:
        - $ref: "#/components/parameters/ExchangeToken"
      requestBody:
        required: false
        description: >-
          The collecting application's own credentials, sent only when no
          `Authorization` header is sent.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperApplicationCredentials"
      responses:
        "200":
          description: A user access token for the collecting application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/burn-token:
    post:
      tags: [Authentication]
      summary: Withdraw a credential
      description: >-
        Withdraw a one-time code or an access token before it would have
        expired. No authentication is required: holding the value is the only
        authority needed to give it up.


        A one-time code is removed and can no longer be spent. An access token
        this service issued is recorded as withdrawn and is refused for the
        rest of its lifetime. The answer is the same empty 200 whether the
        value was withdrawn, was already gone, or was never issued, so this
        operation cannot be used to discover which credentials are outstanding.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialWithdrawal"
      responses:
        "200":
          description: The value is no longer accepted. The response has no body.
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/developer_application:
    post:
      tags: [Developer Applications]
      summary: Register a developer application
      description: >-
        Register a developer application owned by the signed-in person.


        `client_type` is `confidential` or `public` and can never be changed;
        an omitted `client_type` registers a `confidential` application. A
        confidential application is a server-side application that can protect
        a credential: the answer carries its refresh token, which is returned
        only here: it is stored as a hash and cannot be read back. It stays
        valid until it is replaced through the reset_token operation. A public
        client is an installed application that cannot protect a shared
        credential: it signs in only through `GET /api/oauth/authorize` with
        PKCE, receives no credential, and its answer carries no `token`.


        With `UserAccessToken`, the token must have been issued to the
        AbandonAuth site itself and carry the `abandonauth` scope; a token any
        other application holds, and a developer application access token, are
        refused. With `BrowserSession`, the request must also carry the exact
        site `Origin` and an `X-CSRF-Token` equal to the readable CSRF cookie
        and bound to the server-side session. A request authenticated by
        `UserAccessToken` needs neither header.


        Rate limited: every developer application change by one signed-in
        person spends from one budget of 20 per minute, shared by registration,
        deletion, credential reset and callback replacement. A spent budget is
        answered 429 with `Retry-After`.
      security:
        - UserAccessToken: []
        - BrowserSession: []
      parameters:
        - $ref: "#/components/parameters/ConditionalOrigin"
        - $ref: "#/components/parameters/ConditionalCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperApplicationRegistration"
      responses:
        "200":
          description: >-
            The new application, with its refresh token, returned once, only
            when it is confidential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDeveloperApplication"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/developer_application/login:
    post:
      tags: [Developer Applications]
      summary: Exchange an application's refresh token for its access token
      description: >-
        Authenticate a developer application with its identifier and refresh
        token. The answer is a developer application access token whose subject
        is the application itself, is bound to the application's current
        credential version, and expires fifteen minutes after it is issued.


        A refresh token that is not the application's and an application that
        does not exist are refused with the same 401, after the same amount of
        work, so the refusal does not reveal which applications exist. A public
        client has no refresh token, and its identifier is refused with that
        same 401 whatever is presented with it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperApplicationCredentials"
      responses:
        "200":
          description: A developer application access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/developer_application/me:
    get:
      tags: [Developer Applications]
      summary: Describe the developer application its access token authenticates
      description: >-
        Describe the developer application a developer application access token
        authenticates. Only `DeveloperApplicationAccessToken` is accepted: a user
        access token and a browser session are refused. A token issued before
        the application's refresh token was last reset is refused.
      security:
        - DeveloperApplicationAccessToken: []
      responses:
        "200":
          description: The authenticated developer application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperApplication"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/developer_application/{application_id}:
    get:
      tags: [Developer Applications]
      summary: Describe one of the signed-in person's developer applications
      description: >-
        Describe a developer application the signed-in person owns, with the
        exact callback URIs it may be returned to. An application somebody else
        owns is answered 404, exactly as one that does not exist, so ownership
        is never revealed.


        With `UserAccessToken`, the token must have been issued to the
        AbandonAuth site itself and carry the `abandonauth` scope; a token any
        other application holds, and a developer application access token, are
        refused. `BrowserSession` is accepted without further headers because
        this operation changes nothing.
      security:
        - UserAccessToken: []
        - BrowserSession: []
      parameters:
        - $ref: "#/components/parameters/ApplicationIdPath"
      responses:
        "200":
          description: The application and its callback URIs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperApplicationWithCallbackURIs"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Developer Applications]
      summary: Delete one of the signed-in person's developer applications
      description: >-
        Delete a developer application the signed-in person owns, with its
        callback URIs, its logins in progress and its unspent one-time codes.
        An application somebody else owns is answered 404, exactly as one that
        does not exist, so ownership is never revealed.


        With `UserAccessToken`, the token must have been issued to the
        AbandonAuth site itself and carry the `abandonauth` scope; a token any
        other application holds, and a developer application access token, are
        refused. With `BrowserSession`, the request must also carry the exact
        site `Origin` and an `X-CSRF-Token` equal to the readable CSRF cookie
        and bound to the server-side session. A request authenticated by
        `UserAccessToken` needs neither header.


        Rate limited: every developer application change by one signed-in
        person spends from one budget of 20 per minute, shared by registration,
        deletion, credential reset and callback replacement. A spent budget is
        answered 429 with `Retry-After`.
      security:
        - UserAccessToken: []
        - BrowserSession: []
      parameters:
        - $ref: "#/components/parameters/ApplicationIdPath"
        - $ref: "#/components/parameters/ConditionalOrigin"
        - $ref: "#/components/parameters/ConditionalCSRFToken"
      responses:
        "200":
          description: The application that was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperApplication"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/developer_application/{application_id}/reset_token:
    patch:
      tags: [Developer Applications]
      summary: Replace a developer application's refresh token
      description: >-
        Issue a new refresh token for a developer application the signed-in
        person owns. The replaced refresh token stops authenticating the
        application at once, and every developer application access token
        issued against it is refused from then on, because the application's
        credential version changes. The new refresh token is returned only in
        this answer. An application somebody else owns is answered 404, exactly
        as one that does not exist.


        Only a confidential application has a refresh token. A public client
        has none to replace: the request is answered 409 and changes nothing,
        and no credential is ever issued to a public client.


        With `UserAccessToken`, the token must have been issued to the
        AbandonAuth site itself and carry the `abandonauth` scope; a token any
        other application holds, and a developer application access token, are
        refused. With `BrowserSession`, the request must also carry the exact
        site `Origin` and an `X-CSRF-Token` equal to the readable CSRF cookie
        and bound to the server-side session. A request authenticated by
        `UserAccessToken` needs neither header.


        Rate limited: every developer application change by one signed-in
        person spends from one budget of 20 per minute, shared by registration,
        deletion, credential reset and callback replacement. A spent budget is
        answered 429 with `Retry-After`.
      security:
        - UserAccessToken: []
        - BrowserSession: []
      parameters:
        - $ref: "#/components/parameters/ApplicationIdPath"
        - $ref: "#/components/parameters/ConditionalOrigin"
        - $ref: "#/components/parameters/ConditionalCSRFToken"
      responses:
        "200":
          description: The application and its new refresh token, returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperApplicationWithCredential"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "409":
          $ref: "#/components/responses/PublicClientHasNoCredential"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/developer_application/{application_id}/callback_uris:
    patch:
      tags: [Developer Applications]
      summary: Replace a developer application's callback URIs
      description: >-
        Make the set of callback URIs a developer application may be returned
        to exactly the set submitted. URIs not yet registered are added, URIs
        registered but not submitted are removed, and URIs in both are kept. A
        URI is matched by its exact spelling. An empty list leaves the
        application with no callback.


        The set is replaced atomically, whole or not at all: one URI this
        service would not return a browser to is answered 400 and leaves the
        application with the set it had. The 400 names only the zero-based
        index of the first refused URI in the submitted list, never the URI or
        the rule it broke. Replacements of one application's set
        run one after the other under the application's row lock, so two
        arriving together leave one submitted set and never a mixture. An
        application somebody else owns, or one deleted before its set could be
        replaced, is answered 404, exactly as one that does not exist.


        Which URIs are accepted depends on the application's `client_type`.
        A confidential application's callback URI must be absolute and use
        HTTPS, except on a loopback host where a port is required; it carries
        no user information, no fragment, no control characters, and no `code`
        or `authentication` query key, which this service appends itself.


        A public client's callback is a portless loopback template: scheme
        `http`, a host that is exactly an IPv4 literal in `127.0.0.0/8` or the
        IPv6 literal `[::1]`, no port, a non-empty absolute path, no user
        information, no fragment, no control characters, and none of the
        query keys `code`, `state`, `error`, `error_description` or `iss` in
        any letter case or encoding. A host name such as `localhost` is
        refused. For instance `http://127.0.0.1/oauth/callback` and
        `http://[::1]/oauth/callback` are accepted. An authorization request
        names one of these templates with exactly one port, chosen by the
        client at run time, added.


        With `UserAccessToken`, the token must have been issued to the
        AbandonAuth site itself and carry the `abandonauth` scope; a token any
        other application holds, and a developer application access token, are
        refused. With `BrowserSession`, the request must also carry the exact
        site `Origin` and an `X-CSRF-Token` equal to the readable CSRF cookie
        and bound to the server-side session. A request authenticated by
        `UserAccessToken` needs neither header.


        Rate limited: every developer application change by one signed-in
        person spends from one budget of 20 per minute, shared by registration,
        deletion, credential reset and callback replacement. A spent budget is
        answered 429 with `Retry-After`.
      security:
        - UserAccessToken: []
        - BrowserSession: []
      parameters:
        - $ref: "#/components/parameters/ApplicationIdPath"
        - $ref: "#/components/parameters/ConditionalOrigin"
        - $ref: "#/components/parameters/ConditionalCSRFToken"
      requestBody:
        required: true
        description: The complete set of callback URIs.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        "200":
          description: The application whose callback set was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/ui/{provider}/authorize:
    get:
      tags: [Authentication]
      summary: Start a sign-in with a provider
      description: >-
        Start a sign-in with Discord, GitHub, Google or Steam for a developer
        application. A browser navigates here; the answer is a redirect, not a
        JSON document.


        The `callback_uri` must exactly match one of the URIs the application
        registered, compared by its exact spelling; anything else is refused
        with 403 before anything is stored, with the same response whether the
        application or the callback is unknown. A public client is refused with
        that same 403 before anything is stored: it signs in only through
        `GET /api/oauth/authorize`.


        This service then creates login state that is opaque, unpredictable,
        expiring after five minutes and single-use. It is bound to the
        initiating browser by a short-lived cookie, and to the provider, the
        application and the exact registered callback, all held server-side.
        Only the opaque state travels through the browser. PKCE with the `S256`
        challenge method is used for every OAuth provider, Discord, GitHub and
        Google, and a Google sign-in also carries a nonce. The browser is
        redirected to the provider's own fixed HTTPS authorization address.


        Steam signs in through OpenID 2.0, which has no PKCE and no nonce of
        this service's making. Its request is sent to
        `https://steamcommunity.com/openid/login` with `openid.ns`
        `http://specs.openid.net/auth/2.0`, `openid.mode` `checkid_setup`,
        identifier selection for both `openid.claimed_id` and
        `openid.identity`, `openid.realm` the AbandonAuth site's origin
        followed by `/`, and `openid.return_to` that origin followed by
        `/api/ui/steam-callback`, with the opaque state appended as its `state`
        parameter. Steam signs that return address into its answer, which is
        what binds the answer to this sign-in in place of PKCE.


        No access token or session token is ever put in a redirect query
        string.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ApplicationIdQuery"
        - $ref: "#/components/parameters/CallbackURIQuery"
      responses:
        "307":
          $ref: "#/components/responses/RedirectToProvider"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Unavailable"

  /api/ui/discord-callback:
    get:
      tags: [Provider Callbacks]
      summary: Finish a sign-in with Discord
      description: >-
        The address Discord returns the browser to after a sign-in started at
        `/api/ui/discord/authorize`.


        The state must be the opaque, unpredictable, expiring, single-use value
        this service issued, presented by the same browser that started the
        sign-in, for Discord, and it is consumed by one atomic delete. A state
        that was never issued, has expired, was already used, belongs to
        another browser or was started with another provider is refused with
        the same 403. The authorization code is exchanged with the PKCE `S256`
        verifier held for that sign-in.


        For a confidential application's sign-in, every failure after the
        state is consumed is refused with that same 403 response: a provider that does not authenticate the user, a
        provider identity that is incomplete or cannot be stored, and a stored
        callback that no longer passes the callback URI policy, whether or not
        the browser returned with an authorization code. Such a refusal
        carries no redirect and issues no session or one-time code.


        The browser is returned to the exact registered callback spelling,
        with no existing byte rewritten. A sign-in for any developer
        application other than the AbandonAuth site appends only one
        parameter, the one-time code under the `code` query key, which only
        that application can spend at `POST /api/login`. A sign-in for the
        AbandonAuth site itself receives a browser session cookie and nothing
        is appended. A browser returned without an authorization code is sent
        to the callback with nothing appended.


        A sign-in started from a public client's authorization page never
        ends in a browser session or in a one-time code for `POST /api/login`.
        Every provider check above applies unchanged. A state that cannot be
        trusted is refused with the same 403. Once the state, the browser and
        the pending authorization are proven, the browser is sent with 303 to
        the client's validated loopback redirect, built from the exact
        spelling stored when the authorization began: with `code`, the
        client's `state` and `iss` on success; with `error` `access_denied`,
        `state` and `iss` when the provider does not authenticate the person,
        the person declines, or the identity cannot be used; and with `error`
        `server_error`, `state` and `iss` on an internal failure. The native
        authorization code lives at most 120 seconds and never beyond the
        authorization's five-minute deadline.


        Every worker serves at most 64 public-protocol requests at once,
        provider callbacks among them. A callback arriving when they are all
        in use is answered 503 before its parameters are read or its state is
        consumed: the provider is not contacted, and the same callback can be
        retried within the sign-in's lifetime.


        No access token or session token is ever put in a redirect query
        string.
      security: []
      parameters:
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/ProviderAuthorizationCode"
      responses:
        "303":
          $ref: "#/components/responses/RedirectToPublicClient"
        "307":
          $ref: "#/components/responses/RedirectToCallback"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Unavailable"
        "503":
          $ref: "#/components/responses/ServiceTemporarilyUnavailable"

  /api/ui/github-callback:
    get:
      tags: [Provider Callbacks]
      summary: Finish a sign-in with GitHub
      description: >-
        The address GitHub returns the browser to after a sign-in started at
        `/api/ui/github/authorize`.


        The state must be the opaque, unpredictable, expiring, single-use value
        this service issued, presented by the same browser that started the
        sign-in, for GitHub, and it is consumed by one atomic delete. A state
        that was never issued, has expired, was already used, belongs to
        another browser or was started with another provider is refused with
        the same 403. The authorization code is exchanged with the PKCE `S256`
        verifier held for that sign-in.


        For a confidential application's sign-in, every failure after the
        state is consumed is refused with that same 403 response: a provider that does not authenticate the user, a
        provider identity that is incomplete or cannot be stored, and a stored
        callback that no longer passes the callback URI policy, whether or not
        the browser returned with an authorization code. Such a refusal
        carries no redirect and issues no session or one-time code.


        The browser is returned to the exact registered callback spelling,
        with no existing byte rewritten. A sign-in for any developer
        application other than the AbandonAuth site appends only one
        parameter, the one-time code under the `code` query key, which only
        that application can spend at `POST /api/login`. A sign-in for the
        AbandonAuth site itself receives a browser session cookie and nothing
        is appended. A browser returned without an authorization code is sent
        to the callback with nothing appended.


        A sign-in started from a public client's authorization page never
        ends in a browser session or in a one-time code for `POST /api/login`.
        Every provider check above applies unchanged. A state that cannot be
        trusted is refused with the same 403. Once the state, the browser and
        the pending authorization are proven, the browser is sent with 303 to
        the client's validated loopback redirect, built from the exact
        spelling stored when the authorization began: with `code`, the
        client's `state` and `iss` on success; with `error` `access_denied`,
        `state` and `iss` when the provider does not authenticate the person,
