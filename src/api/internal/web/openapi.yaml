        - $ref: "#/components/parameters/OpenIDNamespace"
        - $ref: "#/components/parameters/OpenIDMode"
        - $ref: "#/components/parameters/OpenIDProviderEndpoint"
        - $ref: "#/components/parameters/OpenIDClaimedID"
        - $ref: "#/components/parameters/OpenIDIdentity"
        - $ref: "#/components/parameters/OpenIDReturnTo"
        - $ref: "#/components/parameters/OpenIDResponseNonce"
        - $ref: "#/components/parameters/OpenIDAssociationHandle"
