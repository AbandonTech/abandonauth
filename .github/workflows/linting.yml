name: Linting

on:
  workflow_call

jobs:
  lint:
    name: Runs pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      # SKIP=check: the same script runs in its own workflow, against a
      # PostgreSQL service and with the Go toolchain and cache set up.
      - name: Run pre-commit hooks
        run: SKIP=check pre-commit run --all-files
