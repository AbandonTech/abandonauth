name: Build Api

on:
  workflow_call:
    inputs:
      push:
        description: "If the deployment image is published as the release tag's version and latest."
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Determine the version
        id: version
        env:
          PUBLISH: ${{ inputs.push }}
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to Github Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the development target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: src/api
          target: development
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          push: false

      - name: Build and push the deployment target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: src/api
          target: deployment
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/abandontech/abandonauth-api:${{ steps.version.outputs.version }}
            ${{ inputs.push && 'ghcr.io/abandontech/abandonauth-api:latest' || '' }}
