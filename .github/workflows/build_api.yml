name: Build Api

on:
  workflow_call:
    inputs:
      latest:
        description: "If the container should be tagged as latest."
        type: boolean
        required: false
        default: false
      push:
        description: "If the built container should be pushed."
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to Github Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create SHA Container Tag
        id: sha_tag
        run: |
          tag=$(cut -c 1-7 <<< $GITHUB_SHA)
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Build the development target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: src/api
          target: development
          build-args: |
            COMMIT=${{ steps.sha_tag.outputs.tag }}
          push: false

      - name: Build and push the deployment target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: src/api
          target: deployment
          build-args: |
            COMMIT=${{ steps.sha_tag.outputs.tag }}
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/abandontech/abandonauth-api:${{ steps.sha_tag.outputs.tag }}
            ${{ inputs.latest && 'ghcr.io/abandontech/abandonauth-api:latest' || '' }}
