name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: api-release
  cancel-in-progress: false

jobs:
  linting:
    uses: ./.github/workflows/linting.yml

  check:
    uses: ./.github/workflows/check.yml

  build_api:
    uses: ./.github/workflows/build_api.yml
    needs:
      - linting
      - check
    permissions:
      contents: read
      packages: write
    with:
      push: true
