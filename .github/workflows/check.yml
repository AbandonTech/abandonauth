name: Check

on:
  workflow_call

jobs:
  api:
    name: Run checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum

      - name: Check
        run: ./scripts/check.sh --integration

  website:
    name: Build and test site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the version src/website/Dockerfile builds with.
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: src/website/package-lock.json

      - name: Install dependencies
        run: npm --prefix src/website ci

      - name: Test
        run: npm --prefix src/website test

      - name: Build
        run: npm --prefix src/website run build
