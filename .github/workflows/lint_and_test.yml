name: Lint and Test API

on:
  workflow_call

jobs:
  check:
    name: Runs the check pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum

      # No service block and no TEST_DATABASE_URL: the script brings its own
      # database up, which is what keeps this identical to a local run.
      - name: Check
        run: ./scripts/check.sh --integration
