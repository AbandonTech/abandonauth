name: Main

on:
  push:
    branches: main

jobs:
  linting:
    uses: ./.github/workflows/linting.yml

  check:
    uses: ./.github/workflows/check.yml

  build_api:
    uses: ./.github/workflows/build_api.yml
    needs:
      - linting
      - check
    with:
      latest: true
      push: true

  build_frontend:
    uses: ./.github/workflows/build_frontend.yml
    needs:
      - linting
      - check
    with:
      latest: true
      push: true
